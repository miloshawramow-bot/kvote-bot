name: Probe world feeds
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kambi struktura
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          curl -s -m 60 -A "$UA" "https://eu-offering-api.kambicdn.com/offering/v2018/ubse/listView/football.json?lang=sv_SE&market=SE&channel_id=1" -o f.json
          curl -s -m 60 -A "$UA" "https://eu-offering-api.kambicdn.com/offering/v2018/ubse/listView/basketball.json?lang=sv_SE&market=SE&channel_id=1" -o b.json
          cat > /tmp/parse.py <<'EOF'
import json
for ime in ("f.json", "b.json"):
    try:
        d = json.load(open(ime))
    except Exception as e:
        print(ime, "GRESKA", e)
        continue
    ev = d.get("events", [])
    print(f"== {ime}: {len(ev)} evenata | korenski kljucevi: {sorted(d.keys())}")
    for e0 in ev[:2]:
        print("-- event kljucevi:", sorted(e0.keys()))
        print("-- event.event:", json.dumps(e0.get("event", {}))[:700])
        bo = e0.get("betOffers", [])
        print("-- betOffers:", len(bo))
        for b in bo[:3]:
            print("   offer kljucevi:", sorted(b.keys()))
            print("   offer:", json.dumps({k: v for k, v in b.items() if k != "outcomes"})[:350])
            for o in (b.get("outcomes") or [])[:4]:
                print("     outcome:", json.dumps(o)[:300])
EOF
          python3 /tmp/parse.py > probe_result.txt 2>&1
          head -c 1500 probe_result.txt
      - name: Commit results
        run: |
          git config user.name "kvote-bot"
          git config user.email "kvote-bot@users.noreply.github.com"
          git add probe_result.txt
          git commit -m "kambi struktura" && git push || echo "nista za commit"
