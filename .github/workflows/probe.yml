name: Probe world feeds
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kambi snimci
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          curl -s -m 60 -A "$UA" "https://eu-offering-api.kambicdn.com/offering/v2018/ubse/listView/football.json?lang=sv_SE&market=SE&channel_id=1" -o f.json
          curl -s -m 60 -A "$UA" "https://eu-offering-api.kambicdn.com/offering/v2018/ubse/listView/basketball.json?lang=sv_SE&market=SE&channel_id=1" -o b.json
          echo "== FOOTBALL ==" > probe_result.txt
          head -c 6500 f.json >> probe_result.txt
          echo >> probe_result.txt
          echo "== BASKETBALL ==" >> probe_result.txt
          head -c 6500 b.json >> probe_result.txt
          wc -c f.json b.json >> probe_result.txt
      - name: Commit results
        run: |
          git config user.name "kvote-bot"
          git config user.email "kvote-bot@users.noreply.github.com"
          git add probe_result.txt
          git commit -m "kambi snimci" && git push || echo "nista za commit"
